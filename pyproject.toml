[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-x"
version = "0.1.0"
description = "AI-powered protein crystallization prediction platform"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "pydantic",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
